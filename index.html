<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goombaa Gab Ticker</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap">
    <script src="https://socialstream.ninja/libs/colours.js" type="text/javascript"></script>
    <style>
      body, html {
          margin: 0;
          padding: 0;
          width: 100%;
          height: 100%;
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          background-color: transparent;
          overflow: hidden;
          box-sizing: border-box;
      }

      * {
          box-sizing: border-box;
          -webkit-font-smoothing: antialiased;
      }

      #ticker-container {
          position: absolute;
          bottom: 0;
          left: 0;
          width: 100%;
          height: 100%;
          display: flex;
          align-items: center;
          overflow: hidden;
          white-space: nowrap;
          background: transparent;
      }

      #ticker-track {
          display: inline-flex;
          align-items: center;
          will-change: transform;
          white-space: nowrap;
          position: absolute;
          left: 0;
          gap: 15px;
      }

      .message {
          background: linear-gradient(145deg, #1a2a48, #162238);
          padding: 8px 18px;
          border-radius: 16px;
          border: 2px solid #2e3b55;
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
          color: #e4e6eb;
          flex-shrink: 0;
          display: inline-flex;
          align-items: center;
          white-space: nowrap;
      }

      .avatar-wrapper {
          width: 36px;
          height: 36px;
          border-radius: 50%;
          display: inline-block;
          margin-right: 8px;
          flex-shrink: 0;
          background: #4ab8f9;
          padding: 2px;
      }

      .avatar {
          width: 100%;
          height: 100%;
          border-radius: 50%;
          background-size: cover;
          background-position: center;
      }

      .message-content-wrapper {
          display: inline-flex;
          align-items: center;
          gap: 8px;
      }

      .name-bg {
          background-color: rgba(74, 111, 165, 0.45);
          padding: 3px 8px;
          border-radius: 8px;
          display: inline-flex;
          align-items: center;
      }

      .name {
          color: #b8d4ff;
          font-size: 28px;
          font-weight: 800;
          line-height: 1;
      }

      .text {
          font-size: 28px;
          line-height: 1;
          font-weight: 600;
          color: #ffffff;
      }

      .type-icon {
          width: 24px;
          height: 24px;
          margin-left: 8px;
          vertical-align: middle;
      }
    </style>
</head>
<body>

<div id="ticker-container">
    <div id="ticker-track"></div>
</div>

<script>
    var urlParams = new URLSearchParams(window.location.search);
    var roomID = urlParams.get("session") || "aFC6DXe5k2";
    var password = urlParams.get("password") || urlParams.get("pass") || urlParams.get("pw") || "false";
    
    const SCROLL_SPEED = 145; 
    const MAX_MESSAGES = 8;   
    
    const tickerTrack = document.getElementById('ticker-track');
    let currentPosX = window.innerWidth;
    let lastTimestamp = null;

    function addMessageToOverlay(data) {
        if (!data) return;
        if (!data.chatname && !data.chatmessage && !data.hasDonation && !data.contentimg){
            return;
        }
        
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message');

        let leftEdgeColor = null;
        if (typeof getColorFromType === 'function' && data.type) {
            try { leftEdgeColor = getColorFromType(data.type); } catch (e) {}
        }
        if (leftEdgeColor) {
            messageDiv.style.borderLeft = `4px solid ${leftEdgeColor}`;
            messageDiv.style.paddingLeft = '10px';
        }
        
        const avatarHtml = data.chatimg ? `<div class="avatar-wrapper"><div class="avatar" style="background-image: url('${data.chatimg}');"></div></div>` : '';
        const nameHtml = data.chatname ? `<div class="name-bg"><span class="name">${data.chatname}</span></div>` : '';
        const messageTextHtml = data.chatmessage ? `<span class="text">${data.chatmessage}</span>` : '';
        
        let typeIconHtml = '';
        if (data.type) {
            typeIconHtml = `<img class="type-icon" src="https://socialstream.ninja/images/${data.type}.png" onerror="this.style.display='none'" />`;
        }

        messageDiv.innerHTML = `
            <div class="message-content-wrapper">
                ${avatarHtml}
                ${nameHtml}
                ${messageTextHtml}
                ${typeIconHtml}
            </div>
        `;

        tickerTrack.appendChild(messageDiv);
        
        while (tickerTrack.children.length > MAX_MESSAGES) {
            tickerTrack.removeChild(tickerTrack.firstChild);
        }
    }

    function animate(timestamp) {
        if (!lastTimestamp) lastTimestamp = timestamp;
        const delta = (timestamp - lastTimestamp) / 1000;
        lastTimestamp = timestamp;

        currentPosX -= SCROLL_SPEED * delta;

        const trackWidth = tickerTrack.offsetWidth;
        if (trackWidth > 0 && currentPosX < -trackWidth) {
            currentPosX = window.innerWidth;
        }

        tickerTrack.style.transform = `translateX(${currentPosX}px)`;
        requestAnimationFrame(animate);
    }

    // NATIVE LISTENER
    window.addEventListener("message", function (e) {
        if (!e.data) return;
        if (e.data.overlayNinja) {
            addMessageToOverlay(e.data.overlayNinja);
        } else if (e.data.dataReceived && e.data.dataReceived.overlayNinja) {
            addMessageToOverlay(e.data.dataReceived.overlayNinja);
        } else if (typeof e.data === "object" && (e.data.chatmessage || e.data.chatname)) {
            addMessageToOverlay(e.data);
        }
    });

    // VDO NINJA EMBEDDED FRAME
    var iframe = document.createElement("iframe");
    iframe.src = "https://vdo.socialstream.ninja/?ln&salt=vdo.ninja&password="+encodeURIComponent(password)+"&push&label=dock&vd=0&ad=0&novideo&noaudio&autostart&cleanoutput&room="+roomID;
    iframe.style.cssText = "width: 0px; height: 0px; position: fixed; left: -100px; top: -100px;";
    document.body.appendChild(iframe);

    requestAnimationFrame(animate);
</script>
</body>
</html>
