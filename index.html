<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goombaa Gab Ticker</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap">
    <script src="https://socialstream.ninja/libs/colours.js" type="text/javascript"></script>
    <style>
      body, html {
          margin: 0;
          padding: 0;
          width: 100%;
          height: 100%;
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          background-color: transparent;
          overflow: hidden;
          box-sizing: border-box;
      }

      * {
          box-sizing: border-box;
          -webkit-font-smoothing: antialiased;
      }

      #ticker-container {
          position: absolute;
          bottom: 0;
          left: 0;
          width: 100%;
          height: 100%;
          display: flex;
          align-items: center;
          overflow: hidden;
          white-space: nowrap;
          background: transparent;
      }

      #ticker-track {
          display: inline-flex;
          align-items: center;
          will-change: transform;
          white-space: nowrap;
          position: absolute;
          left: 0;
          gap: 15px;
      }

      .message {
          background: linear-gradient(145deg, #1a2a48, #162238);
          padding: 8px 18px;
          border-radius: 16px;
          border: 2px solid #2e3b55;
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
          color: #e4e6eb;
          flex-shrink: 0;
          display: inline-flex;
          align-items: center;
          white-space: nowrap;
      }

      .avatar-wrapper {
          width: 36px;
          height: 36px;
          border-radius: 50%;
          display: inline-block;
          margin-right: 8px;
          flex-shrink: 0;
          background: #4ab8f9;
          padding: 2px;
      }

      .avatar {
          width: 100%;
          height: 100%;
          border-radius: 50%;
          background-size: cover;
          background-position: center;
      }

      .message-content-wrapper {
          display: inline-flex;
          align-items: center;
          gap: 8px;
      }

      .name-bg {
          background-color: rgba(74, 111, 165, 0.45);
          padding: 3px 8px;
          border-radius: 8px;
          display: inline-flex;
          align-items: center;
      }

      .name {
          color: #b8d4ff;
          font-size: 28px;
          font-weight: 800;
          line-height: 1;
      }

      .text {
          font-size: 28px;
          line-height: 1;
          font-weight: 600;
          color: #ffffff;
      }

      .separator-shell {
          width: 28px;
          height: 28px;
          margin-left: 12px;
          flex-shrink: 0;
          vertical-align: middle;
      }
    </style>
</head>
<body>

<div id="ticker-container">
    <div id="ticker-track"></div>
</div>

<script>
    var urlParams = new URLSearchParams(window.location.search);
    var roomID = urlParams.get("session") || "aFC6DXe5k2";
    var password = urlParams.get("password") || urlParams.get("pass") || urlParams.get("pw") || "false";
    
    const SCROLL_SPEED = 145;
    const MAX_MESSAGES = 8;   
    
    const tickerTrack = document.getElementById('ticker-track');
    let currentPosX = window.innerWidth;
    let lastTimestamp = null;

    function getShellSvg(type) {
        let fillPrimary = "#2ecc71";   
        let fillSecondary = "#27ae60"; 
        let strokeColor = "#1b5e20";   

        const platform = (type || '').toLowerCase();

        if (platform.includes('twitch')) {
            fillPrimary = "#9146FF";   
            fillSecondary = "#772CE8";
            strokeColor = "#3c1175";
        } else if (platform.includes('youtube')) {
            fillPrimary = "#FF0000";   
            fillSecondary = "#CC0000";
            strokeColor = "#660000";
        } else if (platform.includes('tiktok')) {
            fillPrimary = "#111111";   
            fillSecondary = "#222222";
            strokeColor = "#00F2FE";   
        }

        return `
            <svg class="separator-shell" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M 50 10 A 40 38 0 0 1 90 48 C 90 70 80 82 50 82 C 20 82 10 70 10 48 A 40 38 0 0 1 50 10 Z" fill="${fillPrimary}" stroke="${strokeColor}" stroke-width="5"/>
                <path d="M 50 10 L 50 28 M 28 20 L 38 36 M 72 20 L 62 36 M 15 45 L 32 48 M 85 45 L 68 48 M 25 72 L 38 60 M 75 72 L 62 60 M 50 82 L 50 70" stroke="${strokeColor}" stroke-width="4" stroke-linecap="round"/>
                <polygon points="50,28 62,36 62,60 50,70 38,60 38,36" fill="${fillSecondary}" stroke="${strokeColor}" stroke-width="4" stroke-linejoin="round"/>
                <path d="M 12 55 C 15 78 30 86 50 86 C 70 86 85 78 88 55 C 88 64 78 88 50 88 C 22 88 12 64 12 55 Z" fill="#e0e0e0" stroke="${strokeColor}" stroke-width="3"/>
            </svg>
        `;
    }

    function addMessageToOverlay(data) {
        if (!data.chatname && !data.chatmessage && !data.hasDonation && !data.contentimg){
            return;
        }
        
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message');

        let leftEdgeColor = null;
        if (typeof getColorFromType === 'function' && data.type) {
            try { leftEdgeColor = getColorFromType(data.type); } catch (e) {}
        }
        if (leftEdgeColor) {
            messageDiv.style.borderLeft = `4px solid ${leftEdgeColor}`;
            messageDiv.style.paddingLeft = '10px';
        }
        
        const avatarHtml = data.chatimg ? `<div class="avatar-wrapper"><div class="avatar" style="background-image: url('${data.chatimg}');"></div></div>` : '';
        const nameHtml = data.chatname ? `<div class="name-bg"><span class="name">${data.chatname}</span></div>` : '';
        const messageTextHtml = data.chatmessage ? `<span class="text">${data.chatmessage}</span>` : '';
        const shellIconHtml = getShellSvg(data.type);

        messageDiv.innerHTML = `
            <div class="message-content-wrapper">
                ${avatarHtml}
                ${nameHtml}
                ${messageTextHtml}
                ${shellIconHtml}
            </div>
        `;

        tickerTrack.appendChild(messageDiv);
        
        while (tickerTrack.children.length > MAX_MESSAGES) {
            const firstChild = tickerTrack.firstChild;
            if (firstChild) {
                const childWidth = firstChild.offsetWidth + 15; 
                tickerTrack.removeChild(firstChild);
                currentPosX += childWidth; 
            }
        }
    }

    function animate(timestamp) {
        if (!lastTimestamp) lastTimestamp = timestamp;
        const delta = (timestamp - lastTimestamp) / 1000;
        lastTimestamp = timestamp;

        currentPosX -= SCROLL_SPEED * delta;

        const trackWidth = tickerTrack.offsetWidth;
        if (trackWidth > 0 && currentPosX < -trackWidth) {
            currentPosX = window.innerWidth;
        }

        tickerTrack.style.transform = `translateX(${currentPosX}px)`;
        requestAnimationFrame(animate);
    }

    var iframe = document.createElement("iframe");
    iframe.src = "https://vdo.socialstream.ninja/?ln&salt=vdo.ninja&password="+encodeURIComponent(password)+"&push&label=dock&vd=0&ad=0&novideo&noaudio&autostart&cleanoutput&room="+roomID;
    iframe.style.cssText = "width: 0px; height: 0px; position: fixed; left: -100px; top: -100px;";
    document.body.appendChild(iframe);
    
    window.addEventListener("message", function (e) {
        if (e.source != iframe.contentWindow) return;
        if (e.data && typeof e.data === "object" && e.data.dataReceived && e.data.dataReceived.overlayNinja) {
            addMessageToOverlay(e.data.dataReceived.overlayNinja);
        }
    });

    var socketserver = new WebSocket("wss://io.socialstream.ninja");
    socketserver.onopen = function (){
        socketserver.send(JSON.stringify({"join": roomID, "out": 3, "in": 4}));
    };
    socketserver.addEventListener('message', function (event) {
        if (event.data){
            try {
                var data = JSON.parse(event.data);
                if (data) { addMessageToOverlay(data); }
            } catch (error) {}
        }
    });

    requestAnimationFrame(animate);
</script>
</body>
</html>
