<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goombaa Gab Ticker</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap">
    <script src="https://socialstream.ninja/libs/colours.js" type="text/javascript"></script>
    <style>
      body, html {
          margin: 0;
          padding: 0;
          width: 100%;
          height: 100%;
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          background-color: transparent;
          overflow: hidden;
          box-sizing: border-box;
      }

      * {
          box-sizing: border-box;
          -webkit-font-smoothing: antialiased;
      }

      #ticker-container {
          position: absolute;
          bottom: 0;
          left: 0;
          width: 100%;
          height: 100%;
          display: flex;
          align-items: center;
          overflow: hidden;
          white-space: nowrap;
      }

      #ticker-track {
          display: inline-flex;
          align-items: center;
          will-change: transform;
          white-space: nowrap;
          position: absolute;
          left: 0;
          gap: 15px;
      }

      /* Large Message Bubble for Ticker Bar */
      .message {
          background: linear-gradient(145deg, #1a2a48, #162238);
          padding: 8px 18px;
          border-radius: 16px;
          border: 2px solid #2e3b55;
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
          color: #e4e6eb;
          flex-shrink: 0;
          display: inline-flex;
          align-items: center;
          white-space: nowrap;
      }

      .avatar-wrapper {
          width: 36px;
          height: 36px;
          border-radius: 50%;
          display: inline-block;
          margin-right: 8px;
          flex-shrink: 0;
          background: #4ab8f9;
          padding: 2px;
      }

      .avatar {
          width: 100%;
          height: 100%;
          border-radius: 50%;
          background-size: cover;
          background-position: center;
      }

      .message-content-wrapper {
          display: inline-flex;
          align-items: center;
          gap: 8px;
      }

      .name-bg {
          background-color: rgba(74, 111, 165, 0.45);
          padding: 3px 8px;
          border-radius: 8px;
          display: inline-flex;
          align-items: center;
      }

      .name {
          color: #b8d4ff;
          font-size: 28px;
          font-weight: 800;
          line-height: 1;
      }

      .text {
          font-size: 28px;
          line-height: 1;
          font-weight: 600;
          color: #ffffff;
      }

      .source-icon {
          width: 24px;
          height: 24px;
          flex-shrink: 0;
      }

      .badge {
          display: inline-block;
          height: 24px;
      }

      .separator {
          font-size: 28px;
          margin-left: 12px;
          color: #ff9d00;
      }
    </style>
</head>
<body>

<div id="ticker-container">
    <div id="ticker-track"></div>
</div>

<script>
    var urlParams = new URLSearchParams(window.location.search);
    var roomID = urlParams.get("session") || "aFC6DXe5k2";
    var password = urlParams.get("password") || urlParams.get("pass") || urlParams.get("pw") || "false";
    
    // Ticker Settings
    const SCROLL_SPEED = 120; // Pixels per second
    const MAX_MESSAGES = 30;
    
    const tickerTrack = document.getElementById('ticker-track');
    let currentPosX = window.innerWidth;
    let lastTimestamp = null;

    function addMessageToOverlay(data) {
        if (!data.chatname && !data.chatmessage && !data.hasDonation && !data.contentimg){
            return;
        }
        
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message');
        
        var chatbadgesHtml = "";
        if (data.chatbadges) {
            data.chatbadges.forEach(badge => {
                if (typeof badge === "object" && badge.src) {
                    chatbadgesHtml += `<img class='badge' src='${badge.src}' alt='badge'>`;
                } else if (typeof badge === "string") { 
                    chatbadgesHtml += `<img class='badge' src='${badge}' alt='badge'>`;
                }
            });
        }

        let leftEdgeColor = null;
        if (typeof getColorFromType === 'function' && data.type) {
            try { leftEdgeColor = getColorFromType(data.type); } catch (e) {}
        }
        if (leftEdgeColor) {
            messageDiv.style.borderLeft = `4px solid ${leftEdgeColor}`;
            messageDiv.style.paddingLeft = '10px';
        }
        
        const sourceIconHtml = data.type ? `<img src="https://socialstream.ninja/sources/images/${data.type}.png" alt="Source" class="source-icon">` : '';
        const avatarHtml = data.chatimg ? `<div class="avatar-wrapper"><div class="avatar" style="background-image: url('${data.chatimg}');"></div></div>` : '';
        const nameHtml = data.chatname ? `<div class="name-bg"><span class="name">${data.chatname}</span></div>` : '';
        const messageTextHtml = data.chatmessage ? `<span class="text">${data.chatmessage}</span>` : '';

        messageDiv.innerHTML = `
            <div class="message-content-wrapper">
                ${avatarHtml}
                ${nameHtml}
                ${sourceIconHtml}
                ${chatbadgesHtml}
                ${messageTextHtml}
                <span class="separator">🔥</span>
            </div>
        `;

        tickerTrack.appendChild(messageDiv);
        
        while (tickerTrack.children.length > MAX_MESSAGES) {
            tickerTrack.removeChild(tickerTrack.firstChild);
        }
    }

    // Continuous Smooth Animation Loop
    function animate(timestamp) {
        if (!lastTimestamp) lastTimestamp = timestamp;
        const delta = (timestamp - lastTimestamp) / 1000;
        lastTimestamp = timestamp;

        currentPosX -= SCROLL_SPEED * delta;

        const trackWidth = tickerTrack.offsetWidth;
        if (currentPosX < -trackWidth && trackWidth > 0) {
            currentPosX = window.innerWidth;
        }

        tickerTrack.style.transform = `translateX(${currentPosX}px)`;
        requestAnimationFrame(animate);
    }

    // Direct WebRTC/Iframe Bridge Connection
    var iframe = document.createElement("iframe");
    iframe.src = "https://vdo.socialstream.ninja/?ln&salt=vdo.ninja&password="+encodeURIComponent(password)+"&push&label=dock&vd=0&ad=0&novideo&noaudio&autostart&cleanoutput&room="+roomID;
    iframe.style.cssText = "width: 0px; height: 0px; position: fixed; left: -100px; top: -100px;";
    document.body.appendChild(iframe);
    
    window.addEventListener("message", function (e) {
        if (e.source != iframe.contentWindow) return;
        if (e.data && typeof e.data === "object" && e.data.dataReceived && e.data.dataReceived.overlayNinja) {
            addMessageToOverlay(e.data.dataReceived.overlayNinja);
        }
    });

    // Social Stream Ninja WebSocket Connection
    var socketserver = new WebSocket("wss://io.socialstream.ninja");
    socketserver.onopen = function (){
        socketserver.send(JSON.stringify({"join": roomID, "out": 3, "in": 4}));
    };
    socketserver.addEventListener('message', function (event) {
        if (event.data){
            try {
                var data = JSON.parse(event.data);
                if (data) { addMessageToOverlay(data); }
            } catch (error) {}
        }
    });

    requestAnimationFrame(animate);
</script>
</body>
</html>
