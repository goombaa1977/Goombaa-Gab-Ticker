
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goombaa Gab Ticker v2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap">
<script src="https://socialstream.ninja/libs/colours.js"></script>
<style>
body,html{margin:0;padding:0;width:100%;height:100%;background:transparent;font-family:Inter,sans-serif;overflow:hidden}
#ticker-container{position:absolute;inset:0;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
#ticker-track{display:inline-flex;align-items:center;gap:20px;position:absolute;left:0;white-space:nowrap;will-change:transform}
.message{display:inline-flex;align-items:center;flex-shrink:0;color:#fff}
.avatar-wrapper{width:32px;height:32px;border-radius:50%;background:#4ab8f9;padding:2px;margin-right:8px}
.avatar{width:100%;height:100%;border-radius:50%;background-size:cover;background-position:center}
.message-content-wrapper{display:inline-flex;align-items:center;gap:8px}
.name{font-size:26px;font-weight:800;text-shadow:2px 2px 4px rgba(0,0,0,.8)}
.text{font-size:26px;font-weight:600;color:#fff;text-shadow:2px 2px 4px rgba(0,0,0,.8)}
.badge{height:22px}
.separator{font-size:26px;margin-left:15px;color:#ff9d00}
.turtle-shell-icon{width:26px;height:26px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.7))}
</style>
</head>
<body>
<div id="ticker-container"><div id="ticker-track"></div></div>
<script>
const params=new URLSearchParams(location.search);
const roomID=params.get("session")||"aFC6DXe5k2";
const password=params.get("password")||params.get("pass")||params.get("pw")||"false";

const SCROLL_SPEED=120;
const MAX_MESSAGES=8;

const track=document.getElementById("ticker-track");
let x=window.innerWidth,last=null;

function shell(type){
 type=String(type||"").toLowerCase();
 let p="#4CD137",d="#2ED573";
 if(type.includes("twitch")){p="#9146FF";d="#B9A2FF";}
 else if(type.includes("youtube")){p="#FF0000";d="#FF6B6B";}
 else if(type.includes("tiktok")){p="#111111";d="#00F2FE";}
 return `<svg class="turtle-shell-icon" viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="45" ry="40" fill="${p}" stroke="#fff" stroke-width="4"/><polygon points="50,20 68,32 68,55 50,67 32,55 32,32" fill="none" stroke="${d}" stroke-width="5"/></svg>`;
}

function addMessage(raw){
 const name=raw.chatname||raw.username||raw.author||raw.user||raw.name||"";
 const msg=raw.chatmessage||raw.message||raw.text||raw.chat||"";
 if(!name&&!msg&&!raw.hasDonation&&!raw.contentimg) return;
 const platform=raw.type||raw.platform||raw.source||"";
 const img=raw.chatimg||raw.avatar||raw.profileImage||"";
 const badges=Array.isArray(raw.chatbadges)?raw.chatbadges.map(b=>`<img class="badge" src="${typeof b==="string"?b:b.src}">`).join(""):"";
 const div=document.createElement("div");
 div.className="message";
 div.innerHTML=`<div class="message-content-wrapper">
 ${img?`<div class="avatar-wrapper"><div class="avatar" style="background-image:url('${img}')"></div></div>`:""}
 ${shell(platform)}
 <span class="name">${name}:</span>
 ${badges}
 <span class="text">${msg}</span>
 <span class="separator">🔥</span></div>`;
 track.appendChild(div);
 while(track.children.length>MAX_MESSAGES) track.removeChild(track.firstChild);
}

function animate(ts){
 if(!last) last=ts;
 const dt=(ts-last)/1000;
 last=ts;
 x-=SCROLL_SPEED*dt;
 const w=track.offsetWidth;
 if(x<-w&&w>0)x=innerWidth;
 track.style.transform=`translateX(${x}px)`;
 requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// iframe bridge
const iframe=document.createElement("iframe");
iframe.src=`https://vdo.socialstream.ninja/?ln&salt=vdo.ninja&password=${encodeURIComponent(password)}&push&label=dock&vd=0&ad=0&novideo&noaudio&autostart&cleanoutput&room=${roomID}`;
iframe.style.cssText="width:0;height:0;position:fixed;left:-100px;top:-100px";
document.body.appendChild(iframe);
window.addEventListener("message",e=>{
 if(e.source!==iframe.contentWindow)return;
 const d=e.data?.dataReceived?.overlayNinja;
 if(d) addMessage(d);
});

// websocket
function connect(){
 const ws=new WebSocket("wss://io.socialstream.ninja");
 ws.onopen=()=>ws.send(JSON.stringify({join:roomID,out:3,in:4}));
 ws.onmessage=e=>{
   try{const d=JSON.parse(e.data);if(d)addMessage(d);}catch{}
 };
 ws.onclose=()=>setTimeout(connect,3000);
}
connect();
</script>
</body>
</html>
